[package]
name = "speedyf"
version = "0.1.0"
description = "SpeedyF — fast, memory-bounded desktop PDF viewer and editor"
license = "MIT"
edition = "2021"
rust-version = "1.82"
default-run = "speedyf"

[lib]
name = "speedyf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
flate2 = "1"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Online metadata lookup (projects.md §4). Rust-side only; the webview's CSP is
# untouched. rustls so no system OpenSSL on Linux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# The arXiv export API answers in Atom XML.
quick-xml = "0.37"
# Already Tauri's runtime; named here for the sleep that paces a project-wide
# lookup so Crossref and arXiv see a trickle rather than a burst.
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"
# Export a project as a bundle (projects.md §5). Writing only, deflate only:
# the defaults bring every other codec plus AES. `deflate-flate2` reuses the
# flate2 already above rather than adding zopfli and zlib-rs.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
# Live library folder watching (library/watch.rs): FSEvents on macOS,
# inotify on Linux, ReadDirectoryChangesW on Windows - the crate's
# recommended watcher on each. No kqueue, no serde, no channel crates.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
# Markup export (engine/markup_export.rs): PDFium has no way to give a link
# annotation a /Dest, so the internal links are added in a second incremental
# update written by lopdf. No rayon, no chrono.
lopdf = { version = "=0.47.0", default-features = false }
# Search-and-redact patterns (engine/redact/find.rs). Already in the tree.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Password protection (engine/protect.rs): the random AES-256 file key. The
# version lopdf itself already pulls in.
getrandom = { version = "0.4", features = ["sys_rng"] }
# Markup storage key fallback (commands/markup.rs). Already in the tree.
sha2 = "0.10"
# Typed visual signatures (engine/signature.rs): glyph outlines of the bundled
# handwriting fonts, written into the PDF as plain paths. Parsing only, no
# shaping; `std` alone, without the layout and variation tables.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Digital signatures (engine/signing): CMS, X.509 and the signature
# algorithms PDF signers use, all pure Rust so nothing links OpenSSL. Offline:
# no OCSP or CRL fetching. These are the older releases the checker was
# written against, renamed so they sit beside the newer ones below.
cms_02 = { package = "cms", version = "0.2" }
x509_cert_02 = { package = "x509-cert", version = "0.2", default-features = false, features = ["std"] }
der_07 = { package = "der", version = "0.7", features = ["std", "oid", "alloc", "derive"] }
spki_07 = { package = "spki", version = "0.7", features = ["std"] }
rsa_09 = { package = "rsa", version = "0.9", default-features = false, features = ["std", "sha2"] }
p256_013 = { package = "p256", version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "der", "std"] }
sha1 = { version = "0.10", features = ["oid"] }
# Finding signature dictionaries in a file's bytes. Already in the tree.
memchr = "2"
# Certificate signing (engine/signing/sign.rs, keys.rs): PAdES signatures
# built with the pure-Rust RustCrypto stack, offline. These are the newer
# releases p12-keystore needs. rcgen makes the self-signed identity (its
# `ring` backend is already in the tree through rustls); p12-keystore reads
# and writes .p12 files; argon2 and chacha20poly1305 encrypt a key kept in
# the app data directory.
cms = { version = "=0.3.0-rc.2", default-features = false, features = ["std"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
der = { version = "0.8", features = ["std", "derive", "oid"] }
spki = { version = "0.8", features = ["std"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
sha2_11 = { package = "sha2", version = "0.11", features = ["oid"] }
pkcs8 = { version = "0.11", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
p12-keystore = "0.4"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

# Native OCR for scanned pages (engine/ocr.rs): Apple's Vision framework.
# Only the features the module uses — the crate's defaults pull in CoreML,
# CoreMedia, AVFoundation and friends.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSUserDefaults", "NSURL", "NSGeometry"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
# Markup export: WKWebView createPDF turns each HTML comment sheet into one
# vector PDF page (markup_capture.rs).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "WKPDFConfiguration"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6"
# Answering a deferred quit from the main queue (system_quit.rs).
dispatch2 = "0.3"
# Digital signatures: whether a signer's certificate chains to a root the
# system trusts (engine/signing/verify.rs), and certificate identities in the
# Keychain (engine/signing/keys.rs): the key never leaves it; signing goes
# through SecKeyCreateSignature.
security-framework = { version = "3", features = ["macos-12"] }
core-foundation = "0.10"

# Windows and Linux start a fresh process for every "open with"; without this
# a second PDF opens a second copy of the app instead of reaching the one
# already running. macOS needs none of it — the OS keeps a bundle single and
# delivers RunEvent::Opened to it — and registering it there would only get in
# the way of that.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Markup export (markup_capture.rs): the comment sheets are printed to PDF by
# the system web view, through the crates Tauri's own runtime already uses,
# at the versions it uses.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
gtk = { version = "0.18", features = ["v3_24"] }

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[[bin]]
name = "speedyf"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
