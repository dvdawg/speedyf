[package]
name = "speedyf"
version = "0.1.0"
description = "SpeedyF — fast, memory-bounded desktop PDF viewer and editor"
license = "MIT"
edition = "2021"
rust-version = "1.82"
default-run = "speedyf"

[lib]
name = "speedyf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
url = "2"
unicode-normalization = "0.1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

# Windows and Linux start a fresh process for every "open with"; without this
# a second PDF opens a second copy of the app instead of reaching the one
# already running. macOS needs none of it — the OS keeps a bundle single and
# delivers RunEvent::Opened to it — and registering it there would only get in
# the way of that.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[[bin]]
name = "speedyf"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
