[package]
name = "speedyf"
version = "0.1.0"
description = "SpeedyF — fast, memory-bounded desktop PDF viewer and editor"
license = "MIT"
edition = "2021"
rust-version = "1.82"
default-run = "speedyf"

[lib]
name = "speedyf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
flate2 = "1"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Online metadata lookup (projects.md §4). Rust-side only; the webview's CSP is
# untouched. rustls so no system OpenSSL on Linux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# The arXiv export API answers in Atom XML.
quick-xml = "0.37"
# Already Tauri's runtime; named here for the sleep that paces a project-wide
# lookup so Crossref and arXiv see a trickle rather than a burst.
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"
# Export a project as a bundle (projects.md §5). Writing only, deflate only:
# the defaults bring every other codec plus AES. `deflate-flate2` reuses the
# flate2 already above rather than adding zopfli and zlib-rs.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
# Live library folder watching (library/watch.rs): FSEvents on macOS,
# inotify on Linux, ReadDirectoryChangesW on Windows - the crate's
# recommended watcher on each. No kqueue, no serde, no channel crates.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

# Native OCR for scanned pages (engine/ocr.rs): Apple's Vision framework.
# Only the features the module uses — the crate's defaults pull in CoreML,
# CoreMedia, AVFoundation and friends.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }

# Windows and Linux start a fresh process for every "open with"; without this
# a second PDF opens a second copy of the app instead of reaching the one
# already running. macOS needs none of it — the OS keeps a bundle single and
# delivers RunEvent::Opened to it — and registering it there would only get in
# the way of that.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[[bin]]
name = "speedyf"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
